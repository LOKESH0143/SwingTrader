name: Daily Stock Data Update

on:
  schedule:
    # Run hourly from 03:00 UTC to 11:00 UTC (8:30 AM - 4:30 PM IST)
    # This ensures we catch the market close data as soon as it's available
    - cron: '0 3-11 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Allows pushing changes back to repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper
        run: npm run fetch-data

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes in the data directory
          if [[ `git status --porcelain data/` ]]; then
            echo "Changes detected. Committing..."
            git add data/
            git commit -m "Daily Data Update: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes detected."
          fi
